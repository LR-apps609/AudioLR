[package]
name = "audiolr"
version = "0.1.0"
description = "AudioLR: separa voce e strumenti, tutto sul computer"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
serde_json = "1"
sha2 = "0.10"
ureq = "2.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
