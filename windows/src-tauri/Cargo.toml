[package]
name = "isolr"
version = "0.9.1"
description = "IsoLR: separa voce e strumenti, tutto sul computer"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.10", features = ["json"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
trash = "5"
urlencoding = "2"
# ONNX Runtime vero per Massima e Studio (onnxruntime.dll caricata all'avvio del primo modello)
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["load-dynamic", "directml"] }
ort-sys = { version = "=2.0.0-rc.9", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Power", "Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
