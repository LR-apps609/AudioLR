# I modelli di Massima e Studio in ONNX per Windows: stessa rete delle versioni Core ML del Mac,
# provata con ONNX Runtime contro il modello originale (fedeltà in dB), poi tra i file scaricabili
# della release «modelli-windows».
name: Modelli per Windows (ONNX)

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/model-onnx.yml]

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: StrumentiSW
            file: BS-Roformer-SW
            yaml: BS-Roformer-SW.yaml
            pezzo: 352768
          - nome: VoceRevive
            file: bs_roformer_vocals_revive_v3e_unwa
            yaml: config_bs_roformer_vocals_revive_unwa.yaml
            pezzo: 352800
          - nome: VoceRoFormer9
            file: vocals_mel_band_roformer
            yaml: vocals_mel_band_roformer.yaml
            pezzo: 352800
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Più memoria (Revive è grande: senza, la conversione viene fermata)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 24G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -g
      - name: Strumenti
        run: |
          pip install "torch==2.2.2" --index-url https://download.pytorch.org/whl/cpu > pip.log 2>&1
          pip install "numpy<2" pyyaml einops beartype "rotary-embedding-torch==0.6.5" scipy \
            "numba==0.60.0" "llvmlite==0.43.0" "librosa==0.10.2.post1" \
            "onnx==1.16.2" "onnxruntime==1.19.2" "onnxconverter-common==1.14.0" >> pip.log 2>&1 || {
            grep -iE "error|requires|conflict|no matching" pip.log | tail -n 12 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - name: Modello originale
        run: |
          B=https://github.com/nomadkaraoke/python-audio-separator/releases/download/model-configs
          curl -fL --retry 3 -o m.ckpt "$B/${{ matrix.file }}.ckpt"
          curl -fL --retry 3 -o m.yaml "$B/${{ matrix.yaml }}"
      - name: Conversione e prova
        shell: bash {0}
        run: |
          ONNX=1 python Tools/convert_roformer.py m.ckpt m.yaml ${{ matrix.nome }} ${{ matrix.pezzo }} > conv.log 2>&1
          code=$?
          tail -n 60 conv.log
          grep -E "RoFormer|STFT|ONNX|Fatto|pesi|stimata" conv.log | tail -n 12 | while IFS= read -r l; do echo "::notice::$l"; done
          # Se non riesce, le ultime righe dell'errore nel riepilogo
          if [ $code -ne 0 ]; then tail -n 8 conv.log | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit $code
      - name: Pacchetto
        run: |
          sha256sum ${{ matrix.nome }}.onnx | tee ${{ matrix.nome }}.onnx.sha256
          ls -la ${{ matrix.nome }}.*
      - name: Tra i file scaricabili (release «modelli-windows»)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view modelli-windows >/dev/null 2>&1 || \
            gh release create modelli-windows --prerelease --title "Modelli per Windows (non è un aggiornamento)" \
              --notes "I modelli di Massima e Studio in ONNX per AudioLR su Windows, provati contro gli originali."
          gh release upload modelli-windows ${{ matrix.nome }}.onnx ${{ matrix.nome }}.onnx.sha256 ${{ matrix.nome }}.json ${{ matrix.nome }}-prova.f32 --clobber
