# IsoLR per Windows: l'interfaccia (windows/ui, disposta come l'app per Mac) e il motore (site/app) dentro
# un'app Tauri. Prima le prove: i calcoli (core) e le schermate dell'interfaccia nel Chromium del server
# (lo stesso motore di WebView2), poi la compilazione sul Windows di GitHub, l'installazione e l'avvio.
# Su main, se la versione è nuova, il rilascio «win-vX.Y.Z» (da lì l'app si aggiorna da sola);
# sugli altri rami l'installer va nella versione di prova «windows-prova».
name: Windows

on:
  workflow_dispatch:
  push:
    branches: [main, windows, win-motore, win-app, prove-dispositivi]
    paths: [windows/**, site/app/**, Tools/win-dist.sh, .github/workflows/windows.yml]

permissions:
  contents: write

jobs:
  interfaccia:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Calcoli (battiti, accordi, confronto, spartito…)
        run: node --test windows/ui/core/test/*.test.js
      - name: Pagine (con il modello Veloce)
        env:
          GH_TOKEN: ${{ github.token }}
        run: Tools/win-dist.sh
      - name: Schermate dell'interfaccia
        run: |
          npm i --prefix /tmp/pw playwright@1.47.2 --silent
          (cd /tmp/pw && npx playwright install --with-deps chromium > /dev/null)
          PW=/tmp/pw/node_modules/playwright node windows/ui/test/shots.js windows/dist shots
          test -z "$(cat shots/errori.txt)" || { echo "::error::Errori nella pagina: $(head -c 400 shots/errori.txt)"; exit 1; }
      - name: Prove di regressione (bug trovati dai 20 tester il 07/11)
        run: PW=/tmp/pw/node_modules/playwright node windows/ui/test/regressioni.js windows/dist shots
      - name: Schermi veri (1366×768, 1920×1080 e 2560×1440 dal 100% al 200%) e rapporto senza «Segnala»
        run: |
          PW=/tmp/pw/node_modules/playwright node windows/ui/test/dispositivi.js windows/dist dispositivi-win
          cat dispositivi-win/riepilogo.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dispositivi-win
          path: dispositivi-win
      - name: Prova completa (una canzone separata in Veloce, analisi, mixer, download)
        run: |
          python3 - <<'PY'
          import math, struct, wave
          sr, n = 44100, 44100 * 20
          w = wave.open("prova.wav", "wb"); w.setnchannels(2); w.setsampwidth(2); w.setframerate(sr)
          frames = bytearray()
          for i in range(n):
              t = i / sr; ph = t % 0.5
              x = (math.sin(2 * math.pi * 70 * t) * math.exp(-ph * 60) if ph < 0.03 else 0) + 0.25 * math.sin(2 * math.pi * 55 * t) \
                  + 0.2 * math.sin(2 * math.pi * 440 * t + 3 * math.sin(2 * math.pi * 5 * t))
              v = int(max(-1, min(1, x)) * 32767)
              frames += struct.pack("<hh", v, v)
          w.writeframes(bytes(frames)); w.close()
          PY
          PW=/tmp/pw/node_modules/playwright node windows/ui/test/e2e.js windows/dist prova.wav shots
      - name: Nella release «schermate»
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls shots/*.png >/dev/null 2>&1 || exit 0
          gh release upload schermate shots/*.png --clobber

  build:
    needs: interfaccia
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Pagine, ONNX Runtime Web, Signalsmith e modello Veloce
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: Tools/win-dist.sh
      - name: ONNX Runtime con DirectML (calcolo nativo di Massima e Studio)
        shell: bash
        run: |
          mkdir -p windows/src-tauri/libs nuget
          curl -sSLf -o nuget/ort.zip https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime.DirectML/1.20.1
          curl -sSLf -o nuget/dml.zip https://www.nuget.org/api/v2/package/Microsoft.AI.DirectML/1.15.2
          (cd nuget && unzip -q -o ort.zip -d ort && unzip -q -o dml.zip -d dml)
          cp nuget/ort/runtimes/win-x64/native/onnxruntime.dll windows/src-tauri/libs/
          cp nuget/dml/bin/x64-win/DirectML.dll windows/src-tauri/libs/
          # Visual C++ 2015–2022 accanto a IsoLR.exe (distribuzione «app-local» permessa da Microsoft, circa 1 MB):
          # su un PC appena comprato onnxruntime.dll li cerca e senza di loro Massima e Studio non partono
          for f in msvcp140.dll msvcp140_1.dll vcruntime140.dll vcruntime140_1.dll; do cp "/c/Windows/System32/$f" windows/src-tauri/libs/; done
          ls -la windows/src-tauri/libs
      - name: Versione
        id: v
        shell: bash
        run: echo "version=$(python -c "import json;print(json.load(open('windows/src-tauri/tauri.conf.json'))['version'])")" >> "$GITHUB_OUTPUT"
      - name: Icone
        working-directory: windows
        run: |
          npm install --silent
          npx tauri icon ../Resources/Assets.xcassets/AppIcon.appiconset/icon_512x512@2x.png
      - name: Prova del calcolo nativo (modello voce di Studio, sul processore di GitHub)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prova-nativo
          for n in VoceRevive.onnx VoceRevive.json; do
            id=$(gh api repos/${{ github.repository }}/releases/tags/modelli-windows --jq ".assets[] | select(.name==\"$n\") | .id")
            gh api -H "Accept: application/octet-stream" repos/${{ github.repository }}/releases/assets/$id > prova-nativo/$n
          done
          cp windows/src-tauri/libs/DirectML.dll windows/src-tauri/target/release/examples/ 2>/dev/null || true
          cd windows/src-tauri
          cargo build --release --example prova_nativo 2> ../../prova.err || { tail -n 25 ../../prova.err | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          cp libs/DirectML.dll libs/onnxruntime.dll target/release/examples/
          FS=$(python -c "import json;c=json.load(open('../../prova-nativo/VoceRevive.json'));print(len(c['freq_indices'])*2, c['frames'])")
          set -- $FS
          target/release/examples/prova_nativo.exe "$PWD/target/release/examples/onnxruntime.dll" ../../prova-nativo/VoceRevive.onnx $2 $1
      - name: Prove del codice Rust (finestra dentro lo schermo, sorveglianza)
        working-directory: windows/src-tauri
        shell: bash
        run: |
          rustc --edition 2021 --test src/finestra.rs -o finestra-prove.exe && ./finestra-prove.exe
          rustc --edition 2021 --test src/salute.rs -o salute-prove.exe && ./salute-prove.exe
      - name: Compilazione (Rust + installer NSIS)
        working-directory: windows
        shell: bash
        run: |
          npx tauri build 2> build.err || { tail -n 25 build.err | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Installer
        shell: bash
        run: |
          EXE=$(ls windows/src-tauri/target/release/bundle/nsis/*.exe | head -n 1)
          cp "$EXE" "IsoLR-Windows-${{ steps.v.outputs.version }}.exe"
          echo "::notice::Installer: $(du -h IsoLR-Windows-*.exe | cut -f1)"
      - name: Firma dell'installer (se c'è il certificato)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          # Senza certificato l'installer resta non firmato (Windows mostra «Esegui comunque»), come finora
          if (-not $env:WINDOWS_CERT_PFX_BASE64) { Write-Output "::notice::Firma Windows non configurata"; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -like "*x64*" } | Select-Object -Last 1
          $exe = Get-ChildItem "IsoLR-Windows-*.exe" | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe.FullName
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::Firma non riuscita"; exit 1 }
          Remove-Item $pfx
          Write-Output "::notice::Installer firmato"
      - name: Prova di avvio (installa, apri, fotografa)
        shell: pwsh
        run: |
          Start-Process -FilePath ".\IsoLR-Windows-${{ steps.v.outputs.version }}.exe" -ArgumentList "/S" -Wait
          $exe = Get-ChildItem -Path "$env:LOCALAPPDATA\IsoLR", "$env:LOCALAPPDATA\Programs\IsoLR" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -notlike "uninstall*" } | Select-Object -First 1
          if (-not $exe) { Write-Output "::error::IsoLR non risulta installata"; exit 1 }
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Output "::error::IsoLR si è chiusa da sola dopo l'avvio (codice $($p.ExitCode))"; exit 1 }
          # La finestra deve stare tutta dentro lo spazio utile dello schermo (senza la barra delle applicazioni).
          # Lo schermo di GitHub è piccolo: la finestra di partenza (1280×820 + barra del titolo) senza la correzione non ci sta
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @'
          using System; using System.Runtime.InteropServices;
          public static class Fin { [StructLayout(LayoutKind.Sequential)] public struct R { public int L, T, Ri, B; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out R r); }
          '@
          $p.Refresh(); $h = $p.MainWindowHandle
          $wa = [System.Windows.Forms.Screen]::PrimaryScreen.WorkingArea
          $r = New-Object Fin+R; [void][Fin]::GetWindowRect($h, [ref]$r)
          Write-Output "::notice::Schermo $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Size) · spazio utile $($wa.Width)x$($wa.Height) · finestra $($r.Ri - $r.L)x$($r.B - $r.T) in ($($r.L),$($r.T))"
          # 8 pixel di tolleranza: i bordi invisibili di Windows 10/11 attorno alla finestra
          if ($h -eq 0 -or $r.L -lt $wa.Left - 8 -or $r.T -lt $wa.Top - 8 -or $r.Ri -gt $wa.Right + 8 -or $r.B -gt $wa.Bottom + 8) {
            Write-Output "::error::La finestra esce dallo spazio utile dello schermo (parte bassa sotto la barra delle applicazioni o fuori)"; exit 1
          }
          # Clic destro «Separa con IsoLR»: la voce nel registro, e una seconda copia passa la canzone a quella aperta
          $cmd = (Get-ItemProperty "HKCU:\Software\Classes\SystemFileAssociations\audio\shell\IsoLR\command" -ErrorAction SilentlyContinue).'(default)'
          if (-not $cmd -or $cmd -notlike "*$($exe.Name)*") { Write-Output "::error::Manca la voce del clic destro (trovato: $cmd)"; exit 1 }
          Write-Output "::notice::Clic destro: $cmd"
          $wav = Join-Path $env:TEMP "Prova clic destro.wav"
          $n = 44100; $data = New-Object byte[] (44 + $n * 4)
          [Text.Encoding]::ASCII.GetBytes("RIFF").CopyTo($data, 0); [BitConverter]::GetBytes([int](36 + $n * 4)).CopyTo($data, 4)
          [Text.Encoding]::ASCII.GetBytes("WAVEfmt ").CopyTo($data, 8); [BitConverter]::GetBytes([int]16).CopyTo($data, 16)
          [BitConverter]::GetBytes([int16]1).CopyTo($data, 20); [BitConverter]::GetBytes([int16]2).CopyTo($data, 22)
          [BitConverter]::GetBytes([int]44100).CopyTo($data, 24); [BitConverter]::GetBytes([int](44100 * 4)).CopyTo($data, 28)
          [BitConverter]::GetBytes([int16]4).CopyTo($data, 32); [BitConverter]::GetBytes([int16]16).CopyTo($data, 34)
          [Text.Encoding]::ASCII.GetBytes("data").CopyTo($data, 36); [BitConverter]::GetBytes([int]($n * 4)).CopyTo($data, 40)
          for ($i = 0; $i -lt $n; $i++) { $v = [int16](8000 * [Math]::Sin(2 * [Math]::PI * 440 * $i / 44100)); $b2 = [BitConverter]::GetBytes($v); $b2.CopyTo($data, 44 + 4 * $i); $b2.CopyTo($data, 46 + 4 * $i) }
          [IO.File]::WriteAllBytes($wav, $data)
          $p2 = Start-Process -FilePath $exe.FullName -ArgumentList "`"$wav`"" -PassThru
          Start-Sleep -Seconds 8
          if (-not $p2.HasExited) { Write-Output "::error::La seconda copia di IsoLR non si è chiusa (la canzone non passa a quella aperta)"; Stop-Process -Id $p2.Id -Force; exit 1 }
          Start-Sleep -Seconds 4
          if (Test-Path (Join-Path $env:TEMP "IsoLR-apri\da-aprire.txt")) { Write-Output "::error::La finestra non ha preso la canzone del clic destro" ; exit 1 }
          Write-Output "::notice::Clic destro: la canzone è passata alla IsoLR aperta"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("win-avvio-vero.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Stop-Process -Id $p.Id -Force
          Write-Output "::notice::IsoLR per Windows si installa, si avvia e resta aperta"
          # Visual C++ accanto a IsoLR.exe, per i PC appena comprati
          $manca = "msvcp140.dll", "msvcp140_1.dll", "vcruntime140.dll", "vcruntime140_1.dll" | Where-Object { -not (Test-Path (Join-Path $exe.DirectoryName $_)) }
          if ($manca) { Write-Output "::error::L'installer non mette accanto a IsoLR i componenti Visual C++: manca $($manca -join ', ')"; exit 1 }
          Write-Output "::notice::Visual C++ installati accanto a IsoLR.exe"
      - name: Windows pulito (senza i componenti Visual C++)
        # Un PC appena comprato può non avere Visual C++ 2015–2022, che i server di GitHub hanno sempre.
        # Si tolgono qui (macchina usa e getta) e si carica il motore come fa IsoLR: deve dire cosa manca,
        # mai bloccarsi; con i componenti accanto a onnxruntime.dll deve partire.
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -like "*Hostx64\x64*" } | Select-Object -First 1
          $app = Get-ChildItem windows\src-tauri\target\release -Filter *.exe | Select-Object -First 1
          foreach ($d in "windows\src-tauri\libs\onnxruntime.dll", "windows\src-tauri\libs\DirectML.dll", $app.FullName) {
            $deps = (& $dumpbin.FullName /dependents $d) | Where-Object { $_ -match "^\s+\S+\.dll\s*$" } | ForEach-Object { $_.Trim() }
            Write-Output "::notice::$(Split-Path $d -Leaf) usa: $($deps -join ', ')"
          }
          cd windows\src-tauri
          cargo build --release --example prova_pulito 2> ..\..\pulito.err; if ($LASTEXITCODE -ne 0) { Get-Content ..\..\pulito.err -Tail 20; exit 1 }
          $vc = "msvcp140.dll", "msvcp140_1.dll", "vcruntime140.dll", "vcruntime140_1.dll", "concrt140.dll"
          New-Item -ItemType Directory -Force -Path C:\vc-tolti | Out-Null
          foreach ($f in $vc) {
            $p = "C:\Windows\System32\$f"
            if (Test-Path $p) { takeown /f $p | Out-Null; icacls $p /grant "*S-1-5-32-544:F" | Out-Null; Move-Item $p "C:\vc-tolti\$f" -Force }
          }
          $motore = New-Item -ItemType Directory -Force -Path "$env:TEMP\Nicolò De Santis\motore"
          Copy-Item libs\onnxruntime.dll, libs\DirectML.dll $motore
          $exe = "target\release\examples\prova_pulito.exe"
          $out = & $exe "$motore\onnxruntime.dll" 2>&1 | Out-String
          Write-Output "Senza Visual C++: $out (codice $LASTEXITCODE)"
          if ($LASTEXITCODE -eq -1073741515) { Write-Output "::warning::La prova stessa non parte senza Visual C++ (le manca una DLL): risultato non valido" }
          elseif ($LASTEXITCODE -ne 0 -or $out -notmatch "MOTORE") { Write-Output "::error::Senza Visual C++ il motore si interrompe invece di dire cosa manca: $out"; $fail = 1 }
          elseif ($out -match "MOTORE OK") { Write-Output "::notice::Il motore parte anche senza Visual C++ (onnxruntime.dll non ne ha bisogno)" }
          else { Write-Output "::warning::Senza Visual C++ il motore non parte: $($out.Trim())" }
          # Con i componenti accanto al motore (come si possono mettere nell'installer)
          foreach ($f in $vc) { if (Test-Path "C:\vc-tolti\$f") { Copy-Item "C:\vc-tolti\$f" $motore } }
          $out2 = & $exe "$motore\onnxruntime.dll" 2>&1 | Out-String
          Write-Output "Con Visual C++ accanto: $out2"
          if ($out2 -match "MOTORE OK") { Write-Output "::notice::Con i componenti Visual C++ accanto a onnxruntime.dll il motore parte" } else { Write-Output "::warning::Anche con i componenti accanto il motore non parte: $($out2.Trim())" }
          foreach ($f in $vc) { if (Test-Path "C:\vc-tolti\$f") { Move-Item "C:\vc-tolti\$f" "C:\Windows\System32\$f" -Force } }
          exit $fail
      - name: Schermata
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f win-avvio-vero.png ] || exit 0
          gh release upload schermate win-avvio-vero.png --repo "$GITHUB_REPOSITORY" --clobber || true
      - name: Rilascio
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          V=${{ steps.v.outputs.version }}
          F="IsoLR-Windows-$V.exe"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            if gh release view "win-v$V" >/dev/null 2>&1; then echo "::notice::win-v$V esiste già: niente rilascio"; exit 0; fi
            # Il primo paragrafo di NOVITA.txt (awk: Python su Windows non sa stampare «−» e le frecce)
            NOTE=$(awk 'BEGIN { RS = "" } NR == 1 { print; exit }' windows/NOVITA.txt)
            gh release create "win-v$V" "$F" --title "IsoLR per Windows $V" --notes "$NOTE

          Non firmata: la prima volta Windows può mostrare un avviso (Ulteriori informazioni › Esegui comunque)." 2> rel.err || { sed 's/^/::error::/' rel.err; exit 1; }
            echo "::notice::Rilasciata IsoLR per Windows $V"
          else
            gh release view windows-prova >/dev/null 2>&1 || gh release create windows-prova --prerelease --title "IsoLR per Windows (prova, non ufficiale)" --notes "Versioni di prova dei rami di lavoro. Non firmata."
            gh release upload windows-prova "$F" --clobber
          fi
