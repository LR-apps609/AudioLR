# I modelli RoFormer nella forma sicura a 16 bit per il Neural Engine (normalizzazione e attenzione che non
# traboccano): SW a sei strumenti, voce di Studio, voce e cori. Nomi nuovi («…2») così si riscaricano.
name: Modelli RoFormer per il Neural Engine

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/model-ane.yml]

permissions:
  contents: write

jobs:
  convert:
    runs-on: macos-15-intel
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { out: StrumentiSW2, ckpt: BS-Roformer-SW.ckpt, yaml: BS-Roformer-SW.yaml, chunk: 352768 }
          - { out: VoceStudio2, ckpt: model_bs_roformer_ep_317_sdr_12.9755.ckpt, yaml: model_bs_roformer_ep_317_sdr_12.9755.yaml, chunk: 352800 }
          - { out: VoceCori2, ckpt: mel_band_roformer_karaoke_aufr33_viperx_sdr_10.1956.ckpt, yaml: mel_band_roformer_karaoke_aufr33_viperx_sdr_10.1956_config.yaml, chunk: 352800 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Strumenti
        run: |
          # Se l'installazione fallisce, le ultime righe diventano «annotazioni» leggibili dalla pagina della compilazione
          pip install "torch==2.2.2" "coremltools==7.2" "numpy<2" pyyaml einops beartype \
            "numba==0.60.0" "llvmlite==0.43.0" "librosa==0.10.2.post1" "rotary-embedding-torch==0.6.5" scipy > pip.log 2>&1 || {
            grep -iE "error|requires|conflict|no matching" pip.log | tail -n 12 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
          python -c "import torch, coremltools, librosa, rotary_embedding_torch; print(torch.__version__, coremltools.__version__, librosa.__version__)"
      - name: Modello originale
        run: |
          B=https://github.com/nomadkaraoke/python-audio-separator/releases/download/model-configs
          curl -fL --retry 3 -o sw.ckpt $B/${{ matrix.ckpt }}
          curl -fL --retry 3 -o sw.yaml $B/${{ matrix.yaml }}
      - name: Conversione e prova
        run: |
          python Tools/convert_roformer.py sw.ckpt sw.yaml ${{ matrix.out }} ${{ matrix.chunk }} 2>&1 | tee conv.log || true
          # Le righe importanti (e gli errori) come annotazioni
          grep -E "RoFormer|STFT|Core ML|Fatto|pesi|stimata|Error|error|assert|Killed" conv.log | tail -n 15 | while IFS= read -r l; do echo "::notice::$l"; done
          test -f ${{ matrix.out }}.json
      - name: Pacchetto
        run: |
          ditto -c -k --keepParent ${{ matrix.out }}.mlpackage ${{ matrix.out }}.mlpackage.zip
          shasum -a 256 ${{ matrix.out }}.mlpackage.zip | tee ${{ matrix.out }}.sha256
          ls -la ${{ matrix.out }}.*
          echo "::notice::${{ matrix.out }}: $(python -c "import json;d=json.load(open('${{ matrix.out }}.json'));print(d['precision'],'bit,',d['db'],'dB,',d['frames'],'colonne')")"
      - name: Tra i file scaricabili
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/ane'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload modelli-1 ${{ matrix.out }}.mlpackage.zip ${{ matrix.out }}.sha256 ${{ matrix.out }}.json ${{ matrix.out }}-prova.f32 --clobber
