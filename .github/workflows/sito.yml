# Il sito: prepara ONNX Runtime Web e il modello accanto alle pagine, prova il motore contro Demucs
# e il sito intero in un browser vero, poi lo impacchetta per provarlo in locale (release «sito-prova»).
# NON si pubblica da solo: solo a mano (Actions › Sito › Run workflow › pubblica = sì), quando il sito è pronto.
name: Sito

on:
  workflow_dispatch:
    inputs:
      pubblica:
        description: "Pubblicare il sito online su GitHub Pages?"
        type: boolean
        default: false
  push:
    branches: [main, sito, windows]
    paths: [site/**, .github/workflows/sito.yml]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sito
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: ONNX Runtime Web e modello accanto alle pagine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p site/vendor site/models /tmp/ort
          (cd /tmp/ort && npm pack onnxruntime-web@1.19.2 --silent && tar xzf onnxruntime-web-1.19.2.tgz)
          cp /tmp/ort/package/dist/ort.webgpu.min.js /tmp/ort/package/dist/ort-wasm-simd-threaded.jsep.mjs /tmp/ort/package/dist/ort-wasm-simd-threaded.jsep.wasm site/vendor/
          cp /tmp/ort/package/LICENSE site/vendor/LICENZA-onnxruntime.txt 2>/dev/null || true
          gh release download modelli-web --repo "$GITHUB_REPOSITORY" --dir site/models --pattern "HTDemucsWeb.onnx.part*" --pattern "HTDemucsWeb.json" --pattern "HTDemucsWeb-prova.f32" --clobber
          # La descrizione del modello con i suoi pezzi e la dimensione totale (per la barra di download)
          python3 - <<'PY'
          import json, os, glob
          d = json.load(open("site/models/HTDemucsWeb.json"))
          parts = sorted(os.path.basename(p) for p in glob.glob("site/models/HTDemucsWeb.onnx.part*"))
          d["parts"] = parts
          d["bytes"] = sum(os.path.getsize("site/models/" + p) for p in parts)
          json.dump(d, open("site/models/HTDemucsWeb.json", "w"))
          print(d["parts"], d["bytes"])
          PY
          ls -la site/vendor site/models
      - name: Prova del motore (Node) contro Demucs originale
        run: |
          mkdir -p /tmp/t && cat site/models/HTDemucsWeb.onnx.part* > /tmp/t/HTDemucsWeb.onnx && mv site/models/HTDemucsWeb-prova.f32 /tmp/t/
          npm i --prefix /tmp/t onnxruntime-node@1.19.2 --silent
          NODE_PATH=/tmp/t/node_modules node site/test/engine.test.js /tmp/t | tee engine.log
          echo "::notice::$(grep -E 'Sito|Canzone' engine.log | tr '\n' ' ')"
      - name: Prova nel browser vero (Chromium)
        run: |
          npm i --prefix /tmp/pw playwright@1.47.2 --silent
          (cd /tmp/pw && npx playwright install --with-deps chromium > /dev/null)
          (python3 site/test/server.py site 8080 > /tmp/server.log 2>&1 &)
          sleep 2
          NODE_PATH=/tmp/pw/node_modules node site/test/browser.test.js http://127.0.0.1:8080/ | tee browser.log
          echo "::notice::$(grep -E 'Tracce|WAV' browser.log | tr '\n' ' ')"
      - name: Schermata del sito
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f sito-risultati.png ] || exit 0
          gh release view schermate --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || exit 0
          gh release upload schermate sito-risultati.png sito-inizio.png --repo "$GITHUB_REPOSITORY" --clobber
      - name: Pacchetto per provarlo in locale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          rm -rf /tmp/pack && mkdir -p /tmp/pack/AudioLR-sito
          cp -R site/. /tmp/pack/AudioLR-sito/
          rm -rf /tmp/pack/AudioLR-sito/test
          cp site/test/apri-sito.command /tmp/pack/AudioLR-sito/ 2>/dev/null || true
          chmod +x /tmp/pack/AudioLR-sito/apri-sito.command
          (cd /tmp/pack && zip -qr AudioLR-sito-prova.zip AudioLR-sito)
          ls -la /tmp/pack
          gh release view sito-prova --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create sito-prova --repo "$GITHUB_REPOSITORY" --prerelease --title "Sito · prova in locale (non pubblicato)" \
              --notes "Il sito di AudioLR da provare sul proprio Mac, senza pubblicarlo. Scarica lo zip, aprilo e fai clic destro su apri-sito.command › Apri (la prima volta macOS chiede conferma): si apre nel browser su http://localhost:8080. Nessun dato esce dal computer."
          gh release upload sito-prova /tmp/pack/AudioLR-sito-prova.zip --repo "$GITHUB_REPOSITORY" --clobber
      - name: Sito pronto per le prove nei browser
        uses: actions/upload-artifact@v6
        with:
          name: sito-pronto
          path: site
          retention-days: 3
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Le prove approfondite in tre browser veri: Chromium (Chrome, Edge), Firefox e WebKit (il motore di Safari)
  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/download-artifact@v6
        with:
          name: sito-pronto
          path: /tmp/sito
      - name: Prove approfondite (${{ matrix.browser }})
        env:
          BROWSER: ${{ matrix.browser }}
          LUNGA: ${{ matrix.browser == 'chromium' && '40' || '0' }}
        run: |
          npm i --prefix /tmp/pw playwright@1.47.2 --silent
          (cd /tmp/pw && npx playwright install --with-deps ${{ matrix.browser }} > /dev/null)
          (python3 site/test/server.py /tmp/sito 8080 > /tmp/server.log 2>&1 &)
          sleep 2
          set +e
          NODE_PATH=/tmp/pw/node_modules node site/test/browser-full.test.js http://127.0.0.1:8080/ > full.log 2>&1
          code=$?
          cat full.log
          # Ogni riga della prova nel riepilogo; se è fallita, l'errore come annotazione e il passo fallisce
          grep -E "^\[" full.log | while IFS= read -r l; do echo "::notice::$l"; done
          if [ $code -ne 0 ]; then echo "::error::$(grep -A4 'NON RIUSCITA' full.log | tr '\n' ' ' | cut -c1-900)"; echo "::error::$(grep 'Stato:' full.log | cut -c1-1500)"; fi
          exit $code
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: schermate-${{ matrix.browser }}
          path: sito-telefono-*.png

  deploy:
    needs: build
    # Solo a mano e solo da main: il sito va online quando lo si decide
    if: github.event_name == 'workflow_dispatch' && inputs.pubblica && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
