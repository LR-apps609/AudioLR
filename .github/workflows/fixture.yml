# Prepara la «prova di fedeltà»: una canzone di prova separata da Demucs originale.
# Il test EndToEndTests la usa per controllare che AudioLR dia lo stesso risultato.
# Parte a mano o quando cambia Tools/make_fixture.py.
name: Prova di fedelta

on:
  workflow_dispatch:
  push:
    paths: [Tools/make_fixture.py, .github/workflows/fixture.yml]

permissions:
  contents: write

jobs:
  fixture:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Strumenti
        run: |
          pip install "torch==2.2.2" "torchaudio==2.2.2" "numpy<2"
          pip install --no-deps "demucs==4.0.1" "openunmix==1.3.0"
          pip install dora-search einops julius omegaconf pyyaml tqdm
      - name: Separazione con Demucs originale
        run: python Tools/make_fixture.py HTDemucs-prova.f32
      - name: Tra i file scaricabili
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload modelli-1 HTDemucs-prova.f32 HTDemucs-passi.f32 --clobber
