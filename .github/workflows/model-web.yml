# Il modello del sito: HTDemucs (Veloce) in ONNX per ONNX Runtime Web, provato con onnxruntime
# contro Demucs originale. Si pubblica nella versione «modelli-web»; il sito lo copia accanto alle sue pagine.
name: Modello del sito

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/model-web.yml, Tools/web_demucs.py]

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Strumenti
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.2.2" "torchaudio==2.2.2" > pip.log 2>&1
          pip install "coremltools==7.2" "numpy<2" onnx "onnxruntime==1.19.2" >> pip.log 2>&1
          pip install --no-deps "demucs==4.0.1" "openunmix==1.3.0" >> pip.log 2>&1
          pip install dora-search einops julius omegaconf pyyaml tqdm >> pip.log 2>&1 || { tail -n 20 pip.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Conversione e prova
        run: |
          ONNX=1 python Tools/web_demucs.py htdemucs HTDemucsWeb 2>&1 | tee conv.log || true
          grep -E "ONNX|STFT|Demucs|Fatto|Error|error|assert" conv.log | tail -n 12 | while IFS= read -r l; do echo "::notice::$l"; done
          test -f HTDemucsWeb.onnx
          ls -la HTDemucsWeb.*
      - name: Pezzi da 90 MB (il sito non accetta file più grandi di 100 MB)
        run: |
          split -b 90m -d -a 1 HTDemucsWeb.onnx HTDemucsWeb.onnx.part
          sha256sum HTDemucsWeb.onnx | cut -d" " -f1 > HTDemucsWeb.sha256
          ls -la HTDemucsWeb.onnx.part*
          echo "::notice::HTDemucsWeb: $(ls HTDemucsWeb.onnx.part* | wc -l) pezzi, $(du -h HTDemucsWeb.onnx | cut -f1)"
      - name: Tra i file scaricabili
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.ref == 'refs/heads/sito'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view modelli-web >/dev/null 2>&1 || gh release create modelli-web --prerelease --title "Modelli del sito" --notes "Modelli ONNX per la separazione nel browser."
          gh release upload modelli-web HTDemucsWeb.onnx.part* HTDemucsWeb.json HTDemucsWeb.sha256 HTDemucsWeb-prova.f32 --clobber
