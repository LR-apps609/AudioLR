# Il terzo modello voce di Studio: BS-RoFormer «Vocals Revive V3e» (unwa). Nel banco al massimo, in squadra
# con SW e Kim, dà la voce pulita quanto viperx (12,20 dB) lasciando fuori pad e tastiere tenute, ed è circa
# tre volte più veloce di viperx. Stessa conversione a 16 bit senza pesi compressi dei modelli voce «3».
name: Modello voce Revive

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/model-revive.yml]

permissions:
  contents: write

jobs:
  convert:
    runs-on: macos-15-intel
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Strumenti
        run: |
          pip install "torch==2.2.2" "coremltools==7.2" "numpy<2" pyyaml einops beartype \
            "numba==0.60.0" "llvmlite==0.43.0" "librosa==0.10.2.post1" "rotary-embedding-torch==0.6.5" scipy > pip.log 2>&1 || {
            grep -iE "error|requires|conflict|no matching" pip.log | tail -n 12 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - name: Modello originale
        run: |
          B=https://github.com/nomadkaraoke/python-audio-separator/releases/download/model-configs
          curl -fL --retry 3 -o m.ckpt "$B/bs_roformer_vocals_revive_v3e_unwa.ckpt"
          curl -fL --retry 3 -o m.yaml "$B/config_bs_roformer_vocals_revive_unwa.yaml"
      - name: Conversione e prova
        shell: bash {0}
        run: |
          SENZA_W8=1 python Tools/convert_roformer.py m.ckpt m.yaml VoceRevive 352800 > conv.log 2>&1
          code=$?
          tail -n 40 conv.log
          grep -E "RoFormer|STFT|Core ML|Fatto|pesi|stimata" conv.log | tail -n 12 | while IFS= read -r l; do echo "::notice::$l"; done
          if [ $code -ne 0 ]; then tail -n 8 conv.log | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit $code
      - name: Pacchetto
        run: |
          N=VoceRevive
          ditto -c -k --keepParent $N.mlpackage $N.mlpackage.zip
          shasum -a 256 $N.mlpackage.zip | tee $N.sha256
          ls -la $N.*
          echo "::notice::$N: $(python -c "import json;d=json.load(open('$N.json'));print(d['precision'],'bit,',d['db'],'dB')") · $(du -h $N.mlpackage.zip | cut -f1)"
      - name: Tra i file scaricabili
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload modelli-1 VoceRevive.mlpackage.zip VoceRevive.sha256 VoceRevive.json VoceRevive-prova.f32 --clobber
