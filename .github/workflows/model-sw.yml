# Modello a sei strumenti BS-Roformer-SW (voce, batteria, basso, chitarra, piano, altro) per la
# «Massima qualità»: conversione in Core ML, prove di fedeltà e pubblicazione tra i file scaricabili.
name: Modello strumenti SW

on:
  workflow_dispatch:
  push:
    # Solo se cambia questo file: il modello pubblicato funziona, non va riconvertito a ogni modifica del convertitore
    paths: [.github/workflows/model-sw.yml]

permissions:
  contents: write

jobs:
  convert:
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Strumenti
        run: |
          # Se l'installazione fallisce, le ultime righe diventano «annotazioni» leggibili dalla pagina della compilazione
          pip install "torch==2.2.2" "coremltools==7.2" "numpy<2" pyyaml einops beartype \
            "numba==0.60.0" "llvmlite==0.43.0" "librosa==0.10.2.post1" "rotary-embedding-torch==0.6.5" scipy > pip.log 2>&1 || {
            grep -iE "error|requires|conflict|no matching" pip.log | tail -n 12 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
          python -c "import torch, coremltools, librosa, rotary_embedding_torch; print(torch.__version__, coremltools.__version__, librosa.__version__)"
      - name: Modello originale
        run: |
          B=https://github.com/nomadkaraoke/python-audio-separator/releases/download/model-configs
          curl -fL --retry 3 -o sw.ckpt $B/BS-Roformer-SW.ckpt
          curl -fL --retry 3 -o sw.yaml $B/BS-Roformer-SW.yaml
      - name: Conversione e prova
        run: |
          python Tools/convert_roformer.py sw.ckpt sw.yaml StrumentiSW 352768 2>&1 | tee conv.log || true
          # Le righe importanti (e gli errori) come annotazioni
          grep -E "RoFormer|STFT|Core ML|Fatto|pesi|stimata|Error|error|assert|Killed" conv.log | tail -n 15 | while IFS= read -r l; do echo "::notice::$l"; done
          test -f StrumentiSW.json
      - name: Pacchetto
        run: |
          ditto -c -k --keepParent StrumentiSW.mlpackage StrumentiSW.mlpackage.zip
          shasum -a 256 StrumentiSW.mlpackage.zip | tee StrumentiSW.sha256
          ls -la StrumentiSW.*
          echo "::notice::StrumentiSW: $(python -c "import json;d=json.load(open('StrumentiSW.json'));print(d['precision'],'bit,',d['db'],'dB,',d['frames'],'colonne')")"
      - name: Tra i file scaricabili
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload modelli-1 StrumentiSW.mlpackage.zip StrumentiSW.sha256 StrumentiSW.json StrumentiSW-prova.f32 --clobber
