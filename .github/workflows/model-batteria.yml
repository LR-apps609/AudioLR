# Modello per dividere la batteria (MDX23C «DrumSep» di aufr33 e jarredou: cassa, rullante, tom,
# charleston, ride, crash): conversione in Core ML, prove di fedeltà e pubblicazione tra i file scaricabili.
name: Modello batteria DrumSep

on:
  workflow_dispatch:
  push:
    paths: [Tools/convert_mdx23c.py, Tools/mdx23c/**, .github/workflows/model-batteria.yml]

permissions:
  contents: write

jobs:
  convert:
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Strumenti
        run: |
          pip install "torch==2.2.2" "coremltools==7.2" "numpy<2" pyyaml > pip.log 2>&1 || {
            grep -iE "error|requires|conflict|no matching" pip.log | tail -n 12 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - name: Modello originale
        run: |
          B=https://github.com/nomadkaraoke/python-audio-separator/releases/download/model-configs
          curl -fL --retry 3 -o drumsep.ckpt $B/MDX23C-DrumSep-aufr33-jarredou.ckpt
          curl -fL --retry 3 -o drumsep.yaml $B/config_drumsep_mdx23c.yaml
      - name: Conversione e prova
        run: |
          python Tools/convert_mdx23c.py drumsep.ckpt drumsep.yaml BatteriaDrumSep 2>&1 | tee conv.log || true
          grep -E "MDX23C|STFT|Core ML|Fatto|pesi|stimata|Error|error|assert|Killed" conv.log | tail -n 15 | while IFS= read -r l; do echo "::notice::$l"; done
          test -f BatteriaDrumSep.json
      - name: Pacchetto
        run: |
          N=BatteriaDrumSep
          ditto -c -k --keepParent $N.mlpackage $N.mlpackage.zip
          shasum -a 256 $N.mlpackage.zip | tee $N.sha256
          ls -la $N.*
          echo "::notice::$N: $(python -c "import json;d=json.load(open('$N.json'));print(d['precision'],'bit,',d['db'],'dB')")"
      - name: Tra i file scaricabili
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=BatteriaDrumSep
          gh release upload modelli-1 $N.mlpackage.zip $N.sha256 $N.json $N-prova.f32 --clobber
