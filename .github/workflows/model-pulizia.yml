# Valutazione di DeepFilterNet3 (Hendrik Schröter, MIT o Apache 2.0) per «Togli rumore»: conversione in Core ML e ONNX
# con le prove contro l'originale, poi la misura su voci cantate vere (MUSDB18-HQ). Esito: sul canto toglie anche voce,
# quindi l'app usa un calcolo suo (Tools/denoise_ref.py); vedi docs/LICENZE-MODELLI.md. Niente si pubblica più.
name: Modello pulizia

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/model-pulizia.yml, Tools/convert_deepfilter.py, Tools/deepfilter_ref.py, Tools/prova_canto.py]

permissions:
  contents: write

jobs:
  convert:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Strumenti
        run: |
          pip install "torch==2.2.2" "torchaudio==2.2.2" "coremltools==7.2" "numpy<2" "deepfilternet==0.5.6" \
            "onnx==1.16.2" "onnxruntime==1.19.2" "soundfile==0.12.1" > pip.log 2>&1 || {
            grep -iE "error|requires|conflict|no matching" pip.log | tail -n 12 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1; }
      - name: Modello originale (DeepFilterNet3, commit fisso)
        run: |
          git clone -q https://github.com/Rikorose/DeepFilterNet dfn
          git -C dfn checkout -q d375b2d8309e0935d165700c91da9de862a99c31
          unzip -q dfn/models/DeepFilterNet3.zip -d .
          ls DeepFilterNet3 DeepFilterNet3/checkpoints
      - name: Conversione e prove
        shell: bash {0}
        run: |
          python Tools/convert_deepfilter.py DeepFilterNet3 dfn/assets > conv.log 2>&1
          code=$?
          tail -n 40 conv.log
          grep -E "dB|Fatto" conv.log | tail -n 8 | while IFS= read -r l; do echo "::notice::$l"; done
          if [ $code -ne 0 ]; then tail -n 8 conv.log | while IFS= read -r l; do echo "::error::$l"; done; fi
          exit $code
      - name: Voci cantate vere (MUSDB18-HQ, solo misura)
        continue-on-error: true
        shell: bash {0}
        run: |
          pip install -q remotezip scipy
          python Tools/prova_canto.py DeepFilterNet3 > canto.log 2>&1
          cat canto.log | grep -v Warning
          grep -E "dB" canto.log | while IFS= read -r l; do echo "::notice::$l"; done
