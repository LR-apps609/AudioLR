name: AudioLR
options:
  bundleIdPrefix: it.ledion
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: it

targets:
  AudioLR:
    type: application
    platform: macOS
    scheme: {}
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/LICENZA-Demucs.txt
        buildPhase: resources
      - path: NOVITA.txt              # «Cosa c'è di nuovo» dopo un aggiornamento
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: AudioLR
        CFBundleName: AudioLR
        CFBundleDevelopmentRegion: it
        CFBundleShortVersionString: "0.7.0"
        CFBundleVersion: "9"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: "Uso personale di Ledion"
        NSDesktopFolderUsageDescription: "AudioLR apre le canzoni che tieni sulla Scrivania."
        NSDocumentsFolderUsageDescription: "AudioLR apre le canzoni che tieni in Documenti."
        NSDownloadsFolderUsageDescription: "AudioLR apre le canzoni che hai scaricato."
        # «Apri con → AudioLR» per qualsiasi file audio (e, più avanti, dal ponte con OrbitLR)
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Aggiornamento di AudioLR"
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [it.ledion.audiolr.update]
          - CFBundleTypeName: "Audio"
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio]
        # I file .audiolr sono gli aggiornamenti: doppio clic → si installano da soli
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: it.ledion.audiolr.update
            UTTypeDescription: "Aggiornamento di AudioLR"
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [audiolr]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.ledion.AudioLR
        PRODUCT_NAME: AudioLR
        MARKETING_VERSION: "0.7.0"
        CURRENT_PROJECT_VERSION: "9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        COMBINE_HIDPI_IMAGES: YES

  # Test automatici: spettrogramma, divisione in pezzi, lettura e scrittura audio.
  # Girano sul Mac di GitHub a ogni modifica; se uno fallisce, la versione non viene pubblicata.
  AudioLRTests:
    type: bundle.unit-test
    platform: macOS
    # Il codice dell'app compilato direttamente nei test (tranne il punto d'ingresso)
    sources:
      - path: Tests
      - path: Sources
        excludes:
          - "Main.swift"
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.ledion.AudioLRTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_IDENTITY: "-"

schemes:
  AudioLRTests:
    build:
      targets:
        AudioLRTests: [test]
    test:
      config: Debug
      targets:
        - AudioLRTests
